# NorthStar API - 合并进 northstar.mingpixel.net 的 server 块
# 用法: 在 server 块内 include 本文件;JSON 文件位于该 server 的站点根目录

# 带查询参数的接口统一回退到同名静态 JSON(nginx 静态匹配忽略查询串)
location = /update {
    default_type application/json;
    charset utf-8;
    try_files /update.json =404;
}

location = /announcement {
    default_type application/json;
    charset utf-8;
    try_files /announcement.json =404;
}

location = /client {
    default_type application/json;
    charset utf-8;
    try_files /client.json =404;
}

location = /anticheat {
    default_type application/json;
    charset utf-8;
    try_files /anticheat.json =404;
}

# 大文件(整合包 zip / 镜像 jar)下载目录,按需调整
location /download/ {
    autoindex off;
}
