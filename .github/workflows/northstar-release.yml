name: NorthStar Release

# 推送 tag v<版本>(如 v1.0.0)自动构建并以稳定通道发布 GitHub Release。
# 启动器版本 = tag 去掉 v 前缀;窗口标题会同时显示基于的 HMCL 基线版本。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION_TYPE: stable
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Derive version
        run: echo "NORTHSTAR_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build
        run: ./gradlew :HMCL:makeExecutables --no-daemon

      - name: Verify artifacts
        run: |
          cd HMCL/build/libs
          for f in "HMCL-$NORTHSTAR_VERSION.jar" "HMCL-$NORTHSTAR_VERSION.exe" "HMCL-$NORTHSTAR_VERSION.sh"; do
            echo "$(cat "$f.sha256")  $f" | sha256sum -c
          done

      - name: Generate release note
        run: |
          cat > RELEASE_NOTE.md <<EOF
          NorthStar Client v$NORTHSTAR_VERSION(稳定版,基于 HMCL 3.17)

          | 文件 | SHA-256 校验码 |
          | :--- | :--- |
          | HMCL-$NORTHSTAR_VERSION.exe | \`$(cat HMCL/build/libs/HMCL-$NORTHSTAR_VERSION.exe.sha256)\` |
          | HMCL-$NORTHSTAR_VERSION.jar | \`$(cat HMCL/build/libs/HMCL-$NORTHSTAR_VERSION.jar.sha256)\` |
          | HMCL-$NORTHSTAR_VERSION.sh  | \`$(cat HMCL/build/libs/HMCL-$NORTHSTAR_VERSION.sh.sha256)\` |
          EOF

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "HMCL/build/libs/HMCL-$NORTHSTAR_VERSION.exe" \
            "HMCL/build/libs/HMCL-$NORTHSTAR_VERSION.exe.sha256" \
            "HMCL/build/libs/HMCL-$NORTHSTAR_VERSION.jar" \
            "HMCL/build/libs/HMCL-$NORTHSTAR_VERSION.jar.sha256" \
            "HMCL/build/libs/HMCL-$NORTHSTAR_VERSION.sh" \
            "HMCL/build/libs/HMCL-$NORTHSTAR_VERSION.sh.sha256" \
            --title "NorthStar Client v$NORTHSTAR_VERSION" \
            --notes-file RELEASE_NOTE.md
